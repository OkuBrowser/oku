[package]
edition = "2021"
rust-version = "1.88"
name = "hickory-proto"
version = "0.26.3"
authors = ["The contributors to Hickory DNS"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
hickory-proto is a safe and secure low-level DNS library. This is the foundational DNS protocol
library used by the other higher-level Hickory DNS crates.
"""
homepage = "https://hickory-dns.org/"
documentation = "https://docs.rs/hickory-proto"
readme = "README.md"
keywords = [
    "dns",
    "dnssec",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/hickory-dns/hickory-dns"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[package.metadata.cargo-all-features]
skip_optional_dependencies = true
max_combination_size = 2
denylist = [
    "__tls",
    "__https",
    "__quic",
    "__h3",
    "__dnssec",
]

[features]
__dnssec = [
    "dep:bitflags",
    "dep:rustls-pki-types",
    "dep:time",
    "std",
]
access-control = [
    "std",
    "dep:prefix-trie",
]
default = ["std"]
dnssec-aws-lc-rs = [
    "dep:aws-lc-rs",
    "aws-lc-rs/aws-lc-sys",
    "aws-lc-rs/ring-io",
    "__dnssec",
]
dnssec-ring = [
    "dep:ring",
    "__dnssec",
]
mdns = []
no-std-rand = [
    "once_cell/critical-section",
    "dep:critical-section",
]
serde = [
    "dep:serde",
    "std",
    "url/serde",
]
std = [
    "data-encoding/std",
    "ipnet/std",
    "rand/std",
    "rand/thread_rng",
    "ring?/std",
    "thiserror/std",
    "tracing/std",
    "url/std",
]
testing = ["std"]
wasm-bindgen = [
    "dep:wasm-bindgen-crate",
    "dep:js-sys",
]

[lib]
name = "hickory_proto"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[bench]]
name = "lib"
path = "benches/lib.rs"

[[bench]]
name = "lower_name_benches"
path = "benches/lower_name_benches.rs"

[[bench]]
name = "name_benches"
path = "benches/name_benches.rs"

