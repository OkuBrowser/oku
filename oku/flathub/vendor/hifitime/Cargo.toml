[package]
edition = "2021"
name = "hifitime"
version = "3.9.0"
authors = ["Christopher Rabotin <christopher.rabotin@gmail.com>"]
exclude = [
    "*.tar.gz",
    "data/",
]
description = "Ultra-precise date and time handling in Rust for scientific applications with leap second support"
homepage = "https://nyxspace.com/"
documentation = "https://docs.rs/hifitime/"
readme = "README.md"
keywords = [
    "date",
    "time",
    "science",
    "leap-second",
    "no-std",
]
categories = [
    "date-and-time",
    "no-std",
]
license = "Apache-2.0"
repository = "https://github.com/nyx-space/hifitime"

[lib]
name = "hifitime"
crate-type = [
    "cdylib",
    "rlib",
]

[[bench]]
name = "crit_epoch"
harness = false

[[bench]]
name = "crit_duration"
harness = false

[[bench]]
name = "iai_duration"
harness = false

[[bench]]
name = "iai_epoch"
harness = false

[dependencies.der]
version = "0.7.8"
features = [
    "derive",
    "real",
]
optional = true

[dependencies.lexical-core]
version = "0.8.5"
features = [
    "parse-integers",
    "parse-floats",
]
default-features = false

[dependencies.num-traits]
version = "0.2.15"
features = ["libm"]
default-features = false

[dependencies.openssl]
version = "0.10"
features = ["vendored"]
optional = true

[dependencies.pyo3]
version = "0.20.0"
features = ["extension-module"]
optional = true

[dependencies.reqwest]
version = "0.11"
features = [
    "blocking",
    "json",
]
optional = true

[dependencies.serde]
version = "1.0.155"
optional = true

[dependencies.serde_derive]
version = "1.0.155"
optional = true

[dependencies.tabled]
version = "0.15.0"
optional = true

[dev-dependencies.criterion]
version = "0.5.1"

[dev-dependencies.iai]
version = "0.1"

[dev-dependencies.serde_json]
version = "1.0.91"

[features]
asn1der = ["der"]
default = ["std"]
python = [
    "std",
    "asn1der",
    "pyo3",
    "ut1",
]
std = [
    "serde",
    "serde_derive",
]
ut1 = [
    "std",
    "reqwest",
    "tabled",
    "openssl",
]

[target.asmjs-unknown-emscripten.dependencies.js-sys]
version = "0.3"

