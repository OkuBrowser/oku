[package]
edition = "2021"
rust-version = "1.72.0"
name = "papaya"
version = "0.2.5"
authors = ["Ibraheem Ahmed <ibraheem@ibraheem.ca>"]
build = false
exclude = ["assets/*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A fast and ergonomic concurrent hash-table for read-heavy workloads."
readme = "README.md"
keywords = [
    "concurrent",
    "hashmap",
    "atomic",
    "lock-free",
]
categories = [
    "algorithms",
    "concurrency",
    "data-structures",
]
license = "MIT"
repository = "https://github.com/ibraheemdev/papaya"

[features]
default = ["fast-barrier"]
fast-barrier = ["seize/fast-barrier"]
serde = ["dep:serde"]

[lib]
name = "papaya"
path = "src/lib.rs"

[[test]]
name = "basic"
path = "tests/basic.rs"

[[test]]
name = "basic_set"
path = "tests/basic_set.rs"

[[test]]
name = "common"
path = "tests/common.rs"

[[test]]
name = "cuckoo"
path = "tests/cuckoo.rs"

[[test]]
name = "stress"
path = "tests/stress.rs"

[[bench]]
name = "latency"
path = "benches/latency.rs"
harness = false

[[bench]]
name = "single_thread"
path = "benches/single_thread.rs"
harness = false

[dependencies.equivalent]
version = "1"

[dependencies.seize]
version = "0.5"
default-features = false

[dependencies.serde]
version = "1"
optional = true

[dev-dependencies.base64]
version = "0.22"

[dev-dependencies.criterion]
version = "0.5"

[dev-dependencies.dashmap]
version = "5"

[dev-dependencies.hdrhistogram]
version = "7"

[dev-dependencies.num_cpus]
version = "1"

[dev-dependencies.rand]
version = "0.8"

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.tokio]
version = "1"
features = [
    "fs",
    "rt",
]

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(papaya_stress)",
    "cfg(papaya_asan)",
]

[profile.test]
debug-assertions = true
inherits = "release"
