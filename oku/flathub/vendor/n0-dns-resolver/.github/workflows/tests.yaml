# Run all tests, with or without flaky tests.

name: Tests

on:
  workflow_call:
    inputs:
      rust-version:
        description: 'The version of the rust compiler to run'
        type: string
        default: 'stable'
      flaky:
        description: 'Whether to also run flaky tests'
        type: boolean
        default: false
      git-ref:
        description: 'Which git ref to checkout'
        type: string
        default: ${{ github.ref }}

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  SCCACHE_CACHE_SIZE: "50G"
  CRATES_LIST: "n0-dns-resolver"
  NEXTEST_VERSION: "0.9.80"

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  build_and_test_nix:
    timeout-minutes: 30
    name: "Tests"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        name: [ubuntu-latest, macOS-arm-latest]
        rust: [ '${{ inputs.rust-version }}' ]
        features: [all, none, default]
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
            release-os: linux
            release-arch: amd64
            runner: [self-hosted, linux, X64]
          - name: macOS-arm-latest
            os: macOS-latest
            release-os: darwin
            release-arch: aarch64
            runner: [self-hosted, macOS, ARM64]
    env:
      # Using self-hosted runners so use local cache for sccache and
      # not SCCACHE_GHA_ENABLED.
      RUSTC_WRAPPER: "sccache"
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
        ref: ${{ inputs.git-ref }}

    - name: Install ${{ matrix.rust }} rust
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: ${{ matrix.rust }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
      with:
        tool: nextest@${{ env.NEXTEST_VERSION }}

    - name: Install sccache
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

    - name: Select features
      run: |
        case "${{ matrix.features }}" in
            all)
                echo "FEATURES=--all-features" >> "$GITHUB_ENV"
                ;;
            none)
                echo "FEATURES=--no-default-features" >> "$GITHUB_ENV"
                ;;
            default)
                echo "FEATURES=" >> "$GITHUB_ENV"
                ;;
            *)
                exit 1
        esac

    - name: check features
      if: ${{ ! inputs.flaky }}
      run: |
        for i in ${CRATES_LIST//,/ }
        do
          echo "Checking $i $FEATURES"
          cargo check --locked -p $i $FEATURES --lib --bins
        done
      env:
        RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}

    - name: build tests
      run: |
        cargo nextest run --locked --workspace $FEATURES --lib --bins --tests --no-run

    - name: list ignored tests
      run: |
        cargo nextest list --locked --workspace $FEATURES --lib --bins --tests --run-ignored ignored-only

    - name: run tests
      env:
        RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}
        # Required for --message-format libtest-json, used by the flaky runs.
        NEXTEST_EXPERIMENTAL_LIBTEST_JSON: 1
        RUN_IGNORED: ${{ inputs.flaky && 'all' || 'default' }}
        MSG_FORMAT: ${{ inputs.flaky && 'libtest-json' || 'human' }}
        OUT_NAME: ${{ matrix.name }}_${{ matrix.features }}_${{ matrix.rust }}
      run: |
        mkdir -p output
        cargo nextest run --locked --workspace $FEATURES --lib --bins --tests --run-ignored "$RUN_IGNORED" --no-fail-fast --message-format "$MSG_FORMAT" > "output/$OUT_NAME.json"

    - name: doctests
      if: ${{ (matrix.features == 'all') && ! inputs.flaky }}
      run: |
        cargo test --locked --workspace --all-features --doc

    - name: upload results
      if: ${{ failure() && inputs.flaky }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: libtest_run_${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.name }}_${{ matrix.features }}_${{ matrix.rust }}.json
        path: output
        retention-days: 45
        compression-level: 0

  build_and_test_windows:
    timeout-minutes: 30
    name: "Tests"
    runs-on: [self-hosted, windows, x64]
    strategy:
      fail-fast: false
      matrix:
        name: [windows-latest]
        rust: [ '${{ inputs.rust-version }}' ]
        features: [all, none, default]
        target:
          - x86_64-pc-windows-msvc
    env:
      # Self-hosted runner, so use local cache for sccache and
      # not SCCACHE_GHA_ENABLED (same as the nix job).
      RUSTC_WRAPPER: "sccache"
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
        ref: ${{ inputs.git-ref }}

    - name: Install ${{ matrix.rust }} rust
      env:
        RUST_TOOLCHAIN: ${{ matrix.rust }}
        RUST_TARGET: ${{ matrix.target }}
      run: |
        rustup toolchain install $env:RUST_TOOLCHAIN
        rustup toolchain default $env:RUST_TOOLCHAIN
        rustup target add $env:RUST_TARGET
        rustup set default-host $env:RUST_TARGET

    # taiki-e/install-action bootstraps through bash, which resolves to a broken
    # WSL shim on the self-hosted windows runners and mangles the action path.
    # Install nextest by direct download instead, like noq does.
    - name: Cache cargo-nextest
      id: cache-nextest
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/bin/cargo-nextest.exe
        key: nextest-windows-${{ env.NEXTEST_VERSION }}

    - name: Install cargo-nextest
      if: steps.cache-nextest.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        $tmp = New-TemporaryFile | Rename-Item -NewName { $_ -replace 'tmp$', 'zip' } -PassThru
        Invoke-WebRequest -OutFile $tmp https://get.nexte.st/${{ env.NEXTEST_VERSION }}/windows
        $outputDir = if ($Env:CARGO_HOME) { Join-Path $Env:CARGO_HOME "bin" } else { "~/.cargo/bin" }
        $tmp | Expand-Archive -DestinationPath $outputDir -Force
        $tmp | Remove-Item

    - name: Install sccache
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

    # ring compiles its assembly with nasm on windows-msvc; aws-lc-sys
    # (via --all-features and the tls-aws-lc-rs feature) needs cmake and nasm.
    - name: Install NASM
      uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

    - name: Install cmake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

    - name: Select features
      run: |
        switch ("${{ matrix.features }}") {
            "all" {
                echo "FEATURES=--all-features" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
            }
            "none" {
                echo "FEATURES=--no-default-features" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
            }
            "default" {
                echo "FEATURES=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
            }
            default {
                Exit 1
            }
        }

    - name: build tests
      env:
        RUST_TARGET: ${{ matrix.target }}
      run: |
        $feat = if ($env:FEATURES) { $env:FEATURES -split '\s+' } else { @() }
        cargo nextest run --locked --workspace @feat --lib --bins --tests --target $env:RUST_TARGET --no-run

    - name: list ignored tests
      env:
        RUST_TARGET: ${{ matrix.target }}
      run: |
        $feat = if ($env:FEATURES) { $env:FEATURES -split '\s+' } else { @() }
        cargo nextest list --locked --workspace @feat --lib --bins --tests --target $env:RUST_TARGET --run-ignored ignored-only

    - name: run tests
      env:
        RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}
        # Required for --message-format libtest-json, used by the flaky runs.
        NEXTEST_EXPERIMENTAL_LIBTEST_JSON: 1
        RUST_TARGET: ${{ matrix.target }}
        RUN_IGNORED: ${{ inputs.flaky && 'all' || 'default' }}
        MSG_FORMAT: ${{ inputs.flaky && 'libtest-json' || 'human' }}
        OUT_NAME: ${{ matrix.name }}_${{ matrix.features }}_${{ matrix.rust }}
      run: |
        mkdir -p output
        $feat = if ($env:FEATURES) { $env:FEATURES -split '\s+' } else { @() }
        cargo nextest run --locked --workspace @feat --lib --bins --tests --target $env:RUST_TARGET --run-ignored $env:RUN_IGNORED --no-fail-fast --message-format $env:MSG_FORMAT > "output/$($env:OUT_NAME).json"

    - name: upload results
      if: ${{ failure() && inputs.flaky }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: libtest_run_${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.name }}_${{ matrix.features }}_${{ matrix.rust }}.json
        path: output
        retention-days: 45
        compression-level: 0
