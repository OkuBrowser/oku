[package]
edition = "2024"
rust-version = "1.95.0"
name = "async-rt"
version = "0.2.0"
authors = ["Darius Clark"]
build = false
exclude = [".gitignore"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A small library designed to utilize async executors through an common API while extending features.
"""
readme = "README.md"
keywords = [
    "async",
    "non-blocking",
    "futures",
]
categories = ["asynchronous"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/dariusc93/async-rt"

[features]
